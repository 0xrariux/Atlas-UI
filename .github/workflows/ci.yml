name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  platform:
    name: Rust 1.92 · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Check out Atlas
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: atlas-${{ matrix.name }}-rust-1.92

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile every target
        run: cargo check --workspace --all-targets

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the complete test suite
        run: cargo test --workspace --all-targets

      - name: Validate public contracts and release evidence
        run: cargo run -p atlas-ui-tooling -- quality-gate
