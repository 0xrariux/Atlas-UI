[package]
name = "atlas-ui"
description = "Native Rust and Slint design system with tokens, components, and application templates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
documentation = "https://docs.rs/atlas-ui/0.1.1"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["slint", "gui", "ui", "design-system", "components"]
categories = ["gui"]

[dependencies]
atlas-ui-components = { path = "../atlas-ui-components", version = "=0.1.1" }
atlas-ui-core = { path = "../atlas-ui-core", version = "=0.1.1" }
atlas-ui-documents = { path = "../atlas-ui-documents", version = "=0.1.1", optional = true }
atlas-ui-icons = { path = "../atlas-ui-icons", version = "=0.1.1" }
atlas-ui-tokens = { path = "../atlas-ui-tokens", version = "=0.1.1" }
# Slint 1.17.1 currently permits tinyvec 1.13.0, whose alloc-only build is
# broken. Keep fresh consumer resolutions on the last verified release.
tinyvec.workspace = true

[features]
default = []
documents = ["dep:atlas-ui-documents"]

[lints]
workspace = true
